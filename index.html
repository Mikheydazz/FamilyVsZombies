<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Defence — защита двора</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Обёртка держит сцену, окно сообщения и меню друг над другом -->
  <div id="сцена">
    <canvas id="игровое-поле" width="1280" height="720"></canvas>

    <!-- Окно победы / поражения. Скрыто, пока игра идёт -->
    <div id="окно-сообщения" class="скрыто">
      <h1 id="заголовок-сообщения">Заголовок</h1>
      <p id="подпись-сообщения">Подпись</p>
      <p id="рекорд-сообщения" class="рекорд"></p>
      <div class="кнопки-окна">
        <button id="кнопка-заново" type="button">Играть снова</button>
        <button id="кнопка-меню" type="button">В меню</button>
      </div>
    </div>

    <!-- Главное меню: сначала кнопка «Играть», под ней — выбор уровня -->
    <div id="меню">
      <h1 class="меню-заголовок">Family Defence</h1>

      <!-- Стартовый экран меню -->
      <div id="меню-главное">
        <p class="меню-подзаголовок">Защита двора от зомби</p>
        <button id="кнопка-играть" type="button">Играть</button>
        <p class="меню-статистика" id="меню-статистика"></p>
      </div>

      <!-- Экран выбора уровня -->
      <div id="меню-уровни" class="скрыто">
        <p class="меню-подзаголовок">Выберите уровень</p>
        <div id="кнопки-уровней"></div>
        <button id="кнопка-в-главное" type="button">Назад</button>
      </div>
    </div>

    <!-- Колода: выбор растений перед началом уровня -->
    <div id="колода" class="скрыто">
      <h1 class="колода-заголовок">Выбор колоды</h1>
      <p class="колода-подзаголовок" id="колода-подзаголовок">Выберите растения</p>
      <div id="список-растений"></div>
      <div class="кнопки-окна">
        <button id="кнопка-начать" type="button">Начать уровень</button>
        <button id="кнопка-назад" type="button">Назад</button>
      </div>
    </div>
  </div>

  <p class="подсказка-внизу">
    Выберите карту персонажа и щёлкните по газону. Солнечные сферы собираются кликом.
    Молот убирает посаженного персонажа. Пробел — пауза, Escape — снять выбор.
  </p>

  <script src="game.js"></script>
</body>
</html>
